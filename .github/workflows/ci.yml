name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # Proves the library compiles on Windows, including its Windows target framework.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build library (shared TF)
        run: dotnet build Plugin.NotesImporter/Plugin.NotesImporter.csproj -c Release -f net10.0
      - name: Build library (Windows TF)
        run: dotnet build Plugin.NotesImporter/Plugin.NotesImporter.csproj -c Release -f net10.0-windows10.0.19041.0

  # Builds the library's portable TF and runs the unit tests.
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Test
        run: dotnet test Plugin.NotesImporter.Tests/Plugin.NotesImporter.Tests.csproj -c Release
